<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F97316">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Datumsglas</title>
  <style>
    :root {
      --color-1: #FDE68A;
      --color-2: #FDBA74;
      --color-3: #FB923C;
      --color-4: #F97316;
      --color-5: #EA580C;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--color-1) 0%, var(--color-3) 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .jar-container {
      position: relative;
      width: 350px;
      height: 500px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .jar-container.shake {
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-10px) rotate(-2deg); }
      20%, 40%, 60%, 80% { transform: translateX(10px) rotate(2deg); }
    }

    .jar {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, 
        rgba(255, 255, 255, 0.9) 0%, 
        rgba(255, 255, 255, 0.7) 100%);
      border-radius: 20px 20px 40px 40px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.3),
        inset 0 2px 10px rgba(255, 255, 255, 0.5);
      overflow: visible;
    }

    .jar-lid {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 40px;
      background: linear-gradient(to bottom, var(--color-4), var(--color-5));
      border-radius: 10px 10px 0 0;
      box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.2);
      z-index: 5;
    }

    .jar-lid::before {
      content: '';
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      height: 10px;
      background: var(--color-5);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .bow {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 120px;
      z-index: 6;
    }

    .bow-left, .bow-right {
      position: absolute;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      border-radius: 50% 50% 0 50%;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .bow-left {
      left: 10px;
      transform: rotate(-45deg);
    }

    .bow-right {
      right: 10px;
      transform: rotate(45deg) scaleX(-1);
    }

    .bow-center {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, #dc2626, #991b1b);
      border-radius: 50%;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.3);
    }

    .bow-ribbon-left, .bow-ribbon-right {
      position: absolute;
      top: 75px;
      width: 25px;
      height: 80px;
      background: linear-gradient(to bottom, #dc2626, #991b1b);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
    }

    .bow-ribbon-left {
      left: 40px;
      transform: rotate(-15deg);
    }

    .bow-ribbon-right {
      right: 40px;
      transform: rotate(15deg);
    }

    .custom-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      z-index: 2;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .custom-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder-text {
      color: var(--color-5);
      font-size: 14px;
      text-align: center;
      padding: 20px;
      font-weight: 600;
      line-height: 1.5;
    }

    .date-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 400px;
      max-width: 90vw;
      background: white;
      border-radius: 30px;
      padding: 50px 40px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
      z-index: 2000;
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      text-align: center;
    }

    .date-card.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .date-card-heart {
      font-size: 80px;
      margin-bottom: 20px;
      animation: heartbeat 1.5s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.1); }
      50% { transform: scale(1); }
    }

    .date-card-text {
      font-size: 32px;
      font-weight: bold;
      color: var(--color-5);
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .date-card-hint {
      font-size: 16px;
      color: #666;
      margin-top: 30px;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .glass-shine {
      position: absolute;
      top: 50px;
      left: 30px;
      width: 80px;
      height: 200px;
      background: linear-gradient(to right, 
        rgba(255, 255, 255, 0.4), 
        transparent);
      border-radius: 50px;
      transform: rotate(-10deg);
      pointer-events: none;
      z-index: 3;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .jar-container {
      animation: float 6s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>
  
  <div class="jar-container" id="jar">
    <div class="bow">
      <div class="bow-left"></div>
      <div class="bow-right"></div>
      <div class="bow-center"></div>
      <div class="bow-ribbon-left"></div>
      <div class="bow-ribbon-right"></div>
    </div>
    <div class="jar-lid"></div>
    <div class="jar">
      <div class="glass-shine"></div>
      <div class="custom-image">
        <!-- Hier kannst du dein eigenes Bild einfügen -->
        <!-- Ersetze die src mit deinem Bild-URL -->
        <!-- <img src="DEIN-BILD-URL-HIER" alt="Paar"> -->
        <div class="placeholder-text">
            <img src="couple.png" alt="Paar">
          <br>
        </div>
      </div>
    </div>
  </div>

  <div class="date-card" id="dateCard">
    <div class="date-card-heart">❤️</div>
    <div class="date-card-text" id="dateCardText">Zusammen kochen</div>
    <div class="date-card-hint">Klicke nochmal für eine neue Idee</div>
  </div>

  <script>
    const dateIdeas = [
  "Picknick bei Sonnenuntergang",
  "Gemeinsam Pizza machen",
  "Spaziergang mit Eis",
  "Filmabend mit Motto",
  "Koch-Challenge zuhause",
  "Brettspielabend",
  "Dart spielen",
  "Billard spielen",
  "Wandern gehen",
  "Fahrradtour",
  "Tretboot fahren",
  "Schwimmen gehen",
  "Sternenhimmel beobachten",
  "Zoo oder Tierpark",
  "Botanischer Garten",
  "Flohmarkt besuchen",
  "Tanzkurs",
  "Yoga-Challenge",
  "Bouldern",
  "Trampolinhalle",
  "Picknick am See",
  "Alte Fotos austauschen",
  "Buchladen-Date",
  "Fantasiereise",
  "Blind Zeichnen",
  "Puzzlen",
  "Stockbrot grillen",
  "Brunchen",
  "Kuchen backen",
  "Sushi selbst machen",
  "Rollenspiel-Date",
  "Fragen-Date",
  "Truth-or-Dare",
  "Geocaching",
  "Quizabend",
  "Koch-Challenge",
  "Story weiterschreiben",
  "Zeitkapsel machen"
    ];

    const jar = document.getElementById('jar');
    const dateCard = document.getElementById('dateCard');
    const dateCardText = document.getElementById('dateCardText');
    const overlay = document.getElementById('overlay');
    let cardVisible = false;

    jar.addEventListener('click', function(e) {
      e.stopPropagation();
      
      if (cardVisible) {
        hideCard();
      } else {
        showCard();
      }
    });

    overlay.addEventListener('click', function() {
      if (cardVisible) {
        hideCard();
      }
    });

    dateCard.addEventListener('click', function(e) {
      e.stopPropagation();
    });

    function showCard() {
      jar.classList.add('shake');
      
      setTimeout(() => {
        jar.classList.remove('shake');
        
        const randomIdea = dateIdeas[Math.floor(Math.random() * dateIdeas.length)];
        dateCardText.textContent = randomIdea;
        
        overlay.classList.add('show');
        dateCard.classList.add('show');
        cardVisible = true;
      }, 500);
    }

    function hideCard() {
      overlay.classList.remove('show');
      dateCard.classList.remove('show');
      cardVisible = false;
    }

  </script>
</body>
</html>
